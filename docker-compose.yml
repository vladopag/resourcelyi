services:
  resourcelyi:
    build: .
    image: resourcelyi:3.3
    ports:
      - "8080:8080"
    # Host metrics on Linux only (ignored on Docker Desktop for Windows).
    pid: host
    volumes:
      - /:/hostfs:ro
    environment:
      RESOURCELYI_DISK_PATH: /hostfs
    restart: unless-stopped
